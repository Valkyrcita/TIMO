<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Creadores</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="auth-section" class="card">
        <h2>Acceso Creador</h2>
        <input type="text" id="username" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
    </div>

    <div id="dashboard" style="display:none;">
        <h2 id="welcome-msg" class="card"></h2>
        
        <div class="card">
            <h2>Crear Nuevo Quiz (5 Preguntas)</h2>
            <form id="quiz-form">
                <input type="text" id="quiz-title" placeholder="Título del cuestionario" required>
                <div id="questions-container"></div>
                <button type="submit">Generar Cuestionario</button>
            </form>
            <div id="link-container" style="display:none; margin-top:20px; padding:15px; background:#e8f4f8; border-radius:5px;"></div>
        </div>

        <div class="card">
            <h2>Estadísticas de Participantes</h2>
            <button onclick="loadStats()" style="background-color:#28a745; margin-bottom: 15px;">Actualizar Estadísticas</button>
            <div id="stats-list"></div>
        </div>
    </div>

    <script src="creator.js"></script>
</body>
</html>
