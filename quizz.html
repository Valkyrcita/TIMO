<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resolver Cuestionario</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; text-align: center; }
        input, button { display: block; margin: 10px auto; padding: 10px; width: 80%; }
        #timer { color: red; font-size: 1.5em; font-weight: bold; }
        #feedback { font-size: 1.2em; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div id="registration">
        <h2>Ingresa para hacer la prueba</h2>
        <input type="text" id="p-name" placeholder="Tu Nombre" required>
        <input type="number" id="p-account" placeholder="Cuenta (1 a 3 dígitos)" min="1" max="999" required>
        <button onclick="startQuiz()">Comenzar Prueba</button>
    </div>

    <div id="quiz-container" style="display:none;">
        <h2 id="quiz-title"></h2>
        <div id="timer">45s</div>
        <h3 id="question-text"></h3>
        <div id="options"></div>
        <div id="feedback"></div>
    </div>

    <div id="result-container" style="display:none;">
        <h2>Prueba Finalizada</h2>
        <h1 id="final-score"></h1>
    </div>

    <script src="quiz.js"></script>
</body>
</html>
