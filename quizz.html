<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolver Cuestionario</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div id="registration" class="section">
            <h2>Ingresa para hacer la prueba</h2>
            <input type="text" id="p-name" placeholder="Tu Nombre" required>
            <input type="number" id="p-account" placeholder="Cuenta (1 a 3 dígitos)" min="1" max="999" required>
            <button type="button" class="btn btn-primary" onclick="startQuiz()">Comenzar Prueba</button>
        </div>

        <div id="quiz-container" style="display:none;" class="section">
            <h2 id="quiz-title"></h2>
            <div id="timer">45s</div>
            <h3 id="question-text"></h3>
            <div id="options"></div>
            <div id="feedback"></div>
        </div>

        <div id="result-container" style="display:none;" class="section">
            <h2>Prueba Finalizada</h2>
            <h1 id="final-score"></h1>
        </div>
    </div>

    <script>
        window.supabase = window.supabase || supabase.createClient(
            'https://dfkxlugytntvmrhjdmfg.supabase.co',
            'sb_publishable_JsRpqD8vOrG84KtPbR97Ng_Aq9ZpZlO'
        );
    </script>
    <script src="quizz participante.js"></script>
</body>
</html>
