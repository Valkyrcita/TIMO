<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="registration" class="card">
        <h2 id="quiz-title-header">Cargando Quiz...</h2>
        <input type="text" id="p-name" placeholder="Tu Nombre/Alias" required>
        <input type="number" id="p-account" placeholder="Número de cuenta (1 a 3 dígitos)" min="1" max="999" required>
        <button onclick="startQuiz()">Comenzar (45s por pregunta)</button>
    </div>

    <div id="quiz-container" class="card" style="display:none;">
        <div id="timer">45</div>
        <h3 id="question-text"></h3>
        <div id="options-container"></div>
        <div id="feedback"></div>
    </div>

    <div id="result-container" class="card" style="display:none; text-align:center;">
        <h2>¡Cuestionario Completado!</h2>
        <h1 id="final-score" style="font-size: 3em; color:#007bff; margin: 10px 0;"></h1>
        <h3 id="final-time"></h3>
    </div>

    <script src="quiz.js"></script>
</body>
</html>
